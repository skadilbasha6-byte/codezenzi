
name: Build CodeZenzi APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Android project files
        run: |
          test -f codezenzi-android-github-actions/android-wrapper/settings.gradle
          test -f codezenzi-android-github-actions/android-wrapper/build.gradle
          test -f codezenzi-android-github-actions/android-wrapper/app/build.gradle
          test -f codezenzi-android-github-actions/android-wrapper/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: codezenzi-android-github-actions/android-wrapper
        run: gradle --no-daemon assembleDebug

      - name: Verify APK was created
        run: |
          test -f codezenzi-android-github-actions/android-wrapper/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeZenzi-debug-apk
          path: codezenzi-android-github-actions/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
