
name: Build CodeZenzi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Android project
        run: |
          if [ ! -d android-wrapper ]; then
            echo "Android wrapper folder is missing."
            exit 1
          fi
          if [ ! -f android-wrapper/gradlew ]; then
            echo "Gradle wrapper is missing."
            exit 1
          fi
          echo "Android wrapper found."
